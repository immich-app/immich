[package]
name = "immich-sidecar-renderer"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
bytemuck = "1"
lightcraft-engine = { git = "https://github.com/ilyador/lightcraft", rev = "80b44dee4e7d37f41871a0ee03d733a5679a5f0a", default-features = false }
lightcraft-meta = { git = "https://github.com/ilyador/lightcraft", rev = "80b44dee4e7d37f41871a0ee03d733a5679a5f0a" }
lightcraft-codecs = { git = "https://github.com/ilyador/lightcraft", rev = "80b44dee4e7d37f41871a0ee03d733a5679a5f0a", default-features = false }
lightcraft-color = { git = "https://github.com/ilyador/lightcraft", rev = "80b44dee4e7d37f41871a0ee03d733a5679a5f0a" }
lightcraft-geom = { git = "https://github.com/ilyador/lightcraft", rev = "80b44dee4e7d37f41871a0ee03d733a5679a5f0a" }
lightcraft-raster = { git = "https://github.com/ilyador/lightcraft", rev = "80b44dee4e7d37f41871a0ee03d733a5679a5f0a" }
lightcraft-raw = { git = "https://github.com/ilyador/lightcraft", rev = "80b44dee4e7d37f41871a0ee03d733a5679a5f0a" }
quick-xml = "0.38"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
undocumented_unsafe_blocks = "deny"

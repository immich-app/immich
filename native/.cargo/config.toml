# The compile options of the sqlite package:sqlite3 ships (its doc/hook.md), so drift sees no
# difference now that it runs on this copy. The -U lines drop what libsqlite3-sys adds on top.
[env]
LIBSQLITE3_FLAGS = """
-USQLITE_DEFAULT_FOREIGN_KEYS
-USQLITE_ENABLE_API_ARMOR
-USQLITE_ENABLE_COLUMN_METADATA
-USQLITE_ENABLE_FTS3
-USQLITE_ENABLE_FTS3_PARENTHESIS
-USQLITE_ENABLE_LOAD_EXTENSION
-USQLITE_ENABLE_MEMORY_MANAGEMENT
-USQLITE_ENABLE_STAT4
-USQLITE_SOUNDEX
-USQLITE_TEMP_STORE
-USQLITE_USE_URI
SQLITE_DEFAULT_MEMSTATUS=0
SQLITE_DQS=0
SQLITE_ENABLE_BATCH_ATOMIC_WRITE
SQLITE_ENABLE_MATH_FUNCTIONS
SQLITE_ENABLE_PREUPDATE_HOOK
SQLITE_ENABLE_SESSION
SQLITE_HAVE_ISNAN
SQLITE_MAX_EXPR_DEPTH=0
SQLITE_OMIT_AUTHORIZATION
SQLITE_OMIT_DECLTYPE
SQLITE_OMIT_DEPRECATED
SQLITE_OMIT_PROGRESS_CALLBACK
SQLITE_OMIT_SHARED_CACHE
SQLITE_OMIT_TCL_VARIABLE
SQLITE_OMIT_TRACE
SQLITE_STRICT_SUBTYPE=1
SQLITE_TEMP_STORE=2
SQLITE_UNTESTABLE
SQLITE_USE_ALLOCA
"""

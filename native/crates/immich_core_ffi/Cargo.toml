[package]
name = "immich_core_ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

# native_toolchain_rust wants the explicit name and both crate types.
[lib]
name = "immich_core_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
immich_core = { path = "../immich_core" }
immich_db = { path = "../immich_db" }

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }

[build-dependencies]
cbindgen = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }

[lints]
workspace = true

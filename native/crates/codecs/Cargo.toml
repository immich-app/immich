[package]
name = "codecs"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["avif", "jxl"]
# AVIF tone-maps HDR with the profiles jxl-rs makes.
avif = ["jxl", "dep:mp4parse", "dep:rav1d", "dep:yuv"]
jxl = ["dep:jxl", "dep:rayon"]

[dependencies]
jxl = { workspace = true, optional = true }
libc = { workspace = true }
moxcms = { workspace = true }
mp4parse = { workspace = true, optional = true }
pic-scale = { workspace = true }
quick_cache = { workspace = true }
rav1d = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
yuv = { workspace = true, optional = true }

# The C compiler assembles rav1d's arm64 kernels, which MSVC can't.
[target.'cfg(all(target_arch = "aarch64", not(target_env = "msvc")))'.dependencies]
rav1d = { workspace = true, optional = true, features = ["asm_arm64_dotprod", "asm_arm64_i8mm", "asm_arm64_sve2"] }

# NASM (native/mise.toml) assembles the x86 ones.
[target.'cfg(target_arch = "x86_64")'.dependencies]
rav1d = { workspace = true, optional = true, features = ["asm"] }

[lints]
workspace = true

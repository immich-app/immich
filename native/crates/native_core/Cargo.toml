[package]
name = "native_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
convert = []
rotate = ["codecs"]
thumbhash = []
# native_core_ffi turns this on for every target except 32-bit ARM, where rav1d needs nightly Rust.
avif = ["codecs/avif"]
jxl = ["codecs/jxl"]
# One group per target.
flutter = ["convert", "rotate", "thumbhash", "jxl"]

[dependencies]
codecs = { path = "../codecs", default-features = false, optional = true }

[lints]
workspace = true

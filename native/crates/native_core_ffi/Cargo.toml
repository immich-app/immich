[package]
name = "native_core_ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

# native_toolchain_rust wants the explicit name and both crate types.
[lib]
name = "native_core_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
native_core = { path = "../native_core" }
libc = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }

[build-dependencies]
cbindgen = { workspace = true }

[lints]
workspace = true

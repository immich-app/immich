[package]
name = "native_core_ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

# native_toolchain_rust wants the explicit name and both crate types.
[lib]
name = "native_core_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
native_core = { path = "../native_core", features = ["flutter"] }
libc = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }

# rav1d needs nightly Rust on 32-bit ARM.
[target.'cfg(not(target_arch = "arm"))'.dependencies]
native_core = { path = "../native_core", features = ["avif"] }

[build-dependencies]
cbindgen = { workspace = true }

[lints]
workspace = true

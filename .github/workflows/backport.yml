name: Backport

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no pull request code is checked out or executed
    types: [closed, labeled]

permissions: {}

jobs:
  backport:
    name: Backport pull request
    if: >-
      ${{ github.event.pull_request.merged
      && contains(join(github.event.pull_request.labels.*.name, ' '), 'backport:release/') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - id: token
        uses: immich-app/devtools/actions/create-workflow-token@2760f037fd3707bb91b16e4c41dc62b8c512393e # create-workflow-token-action-v3.1.0
        with:
          client-id: ${{ secrets.PUSH_O_MATIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_O_MATIC_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token }}
          persist-credentials: true

      - name: Create backport pull requests
        uses: korthout/backport-action@0ebd44f9c79a4a0a171200dcdcceec3ed9ca732f # v4.7.1
        with:
          github_token: ${{ steps.token.outputs.token }}
          label_pattern: '^backport:(release/.+)$'
          add_author_as_reviewer: true
          add_team_reviewers: employees
          add_labels: 'backport'
          auto_merge_enabled: true
          auto_merge_method: squash
          comment_style: summary
          copy_all_reviewers: true
          copy_labels_pattern: '^changelog:'
          experimental: |
            {
              "conflict_resolution": "draft_commit_conflicts"
            }
          pull_title: '${pull_title}'
          pull_description: 'Backport of #${pull_number} to `${target_branch}`.'
          git_committer_name: 'immich-push-o-matic[bot]'
          git_committer_email: '179150890+immich-push-o-matic[bot]@users.noreply.github.com'

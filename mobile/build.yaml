targets:
   $default:
     builders:
       # `immich_mobile` is owned automatically as the package being built. Only
       # the extra one needs saying: `openapi` is a generated client we own, and
       # its members would otherwise be dropped as foreign — which is the same
       # rule that correctly keeps `dart:async`, auto_route and riverpod out.
       mockito_handles:
         options:
           additional_owned_packages:
             - openapi
           # Match analysis_options' `formatter: page_width`, or `dart format`
           # would want to rewrap every generated file.
           page_width: 120
       #drift @DriftDatabase()
       drift_dev:
         # Disable default builder to use modular builder instead
         enabled: false
       drift_dev:analyzer:
         enabled: true
         options: &drift_options
           store_date_time_values_as_text: true
           named_parameters: true
           write_from_json_string_constructor: false
           data_class_to_companions: false
           # Required for make-migrations
           databases:
             main: lib/data/db/main/database.dart
         generate_for: &drift_generate_for
           - lib/data/db/**
           - lib/infrastructure/repositories/**
       drift_dev:modular:
         enabled: true
         options: *drift_options
         generate_for: *drift_generate_for
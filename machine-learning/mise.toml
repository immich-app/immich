[tools]
python = "3.12"
uv = "0.8.15"

[tasks.install]
run = "uv sync --locked"

[tasks.lint]
run = "uv run ruff check immich_ml scripts test_main.py conftest.py"

[tasks.test]
run = "uv run pytest --cov=immich_ml --cov-report term-missing"

[tasks.test-full]
env = { MACHINE_LEARNING_TEST_FULL = "true", MACHINE_LEARNING_MODEL_REVISION = "v2" }
run = "uv run pytest test_main.py -k TestPredictionEndpoints"

[tasks.format]
run = "uv run ruff format immich_ml scripts test_main.py conftest.py"

[tasks.check]
run = "uv run mypy --strict immich_ml/ scripts/ test_main.py conftest.py"

[tasks.ci-unit]
run = [
  { task = ":install --extra cpu" },
  { task = ":format" },
  { task = ":lint --output-format=github" },
  { task = ":check" },
  { task = ":test" },
]

[tasks.checklist]
run = [
  { task = ":install" },
  { task = ":format" },
  { task = ":lint" },
  { task = ":check" },
  { task = ":test" },
]
